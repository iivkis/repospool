name: Publish RepoSpool snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repospool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Generate and publish .repospool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Skip artifact-only commits to avoid revisional regeneration loop
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          if [ "$changed" = ".repospool" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only the tracked artifact changed; preserve its original source revision"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.skip != 'true'
      - name: Build, generate and verify using only Rust
        if: steps.changes.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release
          target/release/repospool generate . --rev "$GITHUB_SHA" --output "$RUNNER_TEMP/.repospool"
          target/release/repospool verify --artifact "$RUNNER_TEMP/.repospool" --repo .
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/.repospool" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.skip != 'true'
        with:
          name: repospool-${{ github.sha }}
          path: ${{ runner.temp }}/.repospool
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - name: Refresh tracked RepoSpool only when source changes
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if test -f .repospool && cmp -s .repospool "$RUNNER_TEMP/.repospool"; then
            echo "Snapshot is already current"
            exit 0
          fi
          cp "$RUNNER_TEMP/.repospool" .repospool
          git add -- .repospool
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(repospool): refresh tracked source context for $GITHUB_SHA"
          git push origin HEAD:main
