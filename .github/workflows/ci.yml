name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-repospool-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust formatting, clippy, tests and generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: CLI generation, verification and determinism
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked
          target/debug/repospool generate . --output "$RUNNER_TEMP/a.repospool"
          target/debug/repospool generate . --output "$RUNNER_TEMP/b.repospool"
          cmp "$RUNNER_TEMP/a.repospool" "$RUNNER_TEMP/b.repospool"
          target/debug/repospool verify --artifact "$RUNNER_TEMP/a.repospool" --repo .
          test "$(head -n 1 "$RUNNER_TEMP/a.repospool")" = "REPOSPOOL/1.0"

  nix:
    name: Nix package build and external-style invocation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check --no-update-lock-file --show-trace
      - run: nix build --no-update-lock-file .#repospool --out-link "$RUNNER_TEMP/repospool-package"
      - name: Nix-installed CLI generates and verifies a standalone artifact
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/repospool-package/bin/repospool" generate . --output "$RUNNER_TEMP/nix.repospool"
          "$RUNNER_TEMP/repospool-package/bin/repospool" verify --artifact "$RUNNER_TEMP/nix.repospool" --repo .
          test "$(head -n 1 "$RUNNER_TEMP/nix.repospool")" = "REPOSPOOL/1.0"
