name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    concurrency:
      group: rust-${{ github.ref }}
      cancel-in-progress: true
    name: Rust fmt, clippy, test and snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Export generated Cargo lockfile for pinning
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 1
      - name: Rust tests
        run: cargo test --all-targets
      - name: Reader stdlib tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Canonical cross-language round-trip and determinism
        shell: bash
        run: |
          set -euo pipefail
          cargo run -- generate --repo . --output "$RUNNER_TEMP/a.rgp"
          cargo run -- generate --repo . --output "$RUNNER_TEMP/b.rgp"
          cmp "$RUNNER_TEMP/a.rgp" "$RUNNER_TEMP/b.rgp"
          cargo run -- verify --artifact "$RUNNER_TEMP/a.rgp" --repo .
          python3 python/rgp_reader.py --artifact "$RUNNER_TEMP/a.rgp" overview
          python3 python/rgp_reader.py --artifact "$RUNNER_TEMP/a.rgp" read --path README.md

  nix:
    concurrency:
      group: nix-${{ github.ref }}
      cancel-in-progress: true
    name: Nix flake dev-shell evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: nix flake check --show-trace
      - name: Export generated Nix lockfile for pinning
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1
      - run: nix develop --command bash -c 'cargo --version && rustc --version && uv --version && python3 --version'
