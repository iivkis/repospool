# Triggered exactly when this workflow file reaches main. No manual GitHub UI action.
# This is a DIAGNOSTIC, not a qualifying Gate B agent run.
name: Gate B autopilot diagnostic (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gate-b-one-shot.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gate-b-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Diagnostic ${{ matrix.task_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - task_id: rgp-transport-hash
          - task_id: serde-json-deserializer
          - task_id: itsdangerous-hmac
    env:
      TASK_ID: ${{ matrix.task_id }}
      # Frozen for the entire three-repository diagnostic; no model drift.
      MODEL_ID: gpt-4.1-mini-2025-04-14
      GH_TOKEN: ${{ github.token }}
      RUN_ID_PINNED_CORPUS: '40767794459'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen plan and select independently anchored RGP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_b.py plan
          python3 scripts/gate_b_workflow_preflight.py select \
            --task "$TASK_ID" --github-env "$GITHUB_ENV"
      - name: Download and verify real pinned RGP (no model calls)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rgp"
          gh run download "$RUN_ID_PINNED_CORPUS" --repo iivkis/rgp \
            --name "$GATE_B_ARTIFACT_NAME" --dir "$RUNNER_TEMP/rgp"
          python3 scripts/gate_b_workflow_preflight.py verify \
            --task "$TASK_ID" --download-dir "$RUNNER_TEMP/rgp"
      - name: Run independent zero-charge RGP and paired-run preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_b_paired_pilot.py \
            --task "$TASK_ID" --model "$MODEL_ID" \
            --rgp "$RUNNER_TEMP/rgp/REPO_CONTEXT.rgp" \
            --trusted-rgp-sha256 "$GATE_B_RGP_SHA256" \
            --token-budget 8000 --max-steps 4 \
            --output-dir "$RUNNER_TEMP/rgp-diag" --dry-run
          echo 'PREFLIGHT_STATUS=PASS' >> "$GITHUB_ENV"
      - name: Execute bounded diagnostic pair if OpenAI API key already exists
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo 'PAID_STATUS=BLOCKED_MISSING_OPENAI_API_KEY' >> "$GITHUB_ENV"
            echo 'No OPENAI_API_KEY configured; no model API calls or charges.'
            exit 0
          fi
          # Bounded to at most 4 Responses requests per arm, 8 total.
          # The per-arm cumulative input+output token budget is 8000.
          # No raw answers or tokens are uploaded from this workflow.
          python3 scripts/gate_b_paired_pilot.py \
            --task "$TASK_ID" --model "$MODEL_ID" \
            --rgp "$RUNNER_TEMP/rgp/REPO_CONTEXT.rgp" \
            --trusted-rgp-sha256 "$GATE_B_RGP_SHA256" \
            --token-budget 8000 --max-steps 4 \
            --output-dir "$RUNNER_TEMP/rgp-diag" \
            --confirm-api-charges
          echo 'PAID_STATUS=COMPLETE_DIAGNOSTIC_ONLY' >> "$GITHUB_ENV"
      - name: Summarize measured evidence without source text or answers
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'rgp-diag' / 'paired-summary.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### {os.environ['TASK_ID']} / {os.environ['MODEL_ID']}\n\n")
              summary.write(f"RGP preflight: **{os.environ.get('PREFLIGHT_STATUS', 'NOT_PASSED')}**.\n\n")
              if target.exists():
                  report = json.loads(target.read_text(encoding='utf-8'))
                  summary.write(f"Agent diagnostic: **{report['status']}**; {report['completed_arms']}/2 arms.\n\n")
                  for arm, value in report['results'].items():
                      summary.write(f"- {arm}: {value['total_tokens']} provider tokens, {value['tool_calls']} tool calls, {value['elapsed_ms']} ms\n")
              else:
                  summary.write(f"Agent diagnostic: **{os.environ.get('PAID_STATUS', 'UNAVAILABLE_OR_FAILED')}**.\n\n")
              summary.write("\n**This is not a Gate B scoring trial. Official status remains HOLD.**\n")
          PY
