[package]
name = "rgp"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Reproducible repository snapshots for AI agents"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
